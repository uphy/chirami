name: CI

on:
  pull_request:
    paths:
      - '**/*.swift'
      - '.swiftlint.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'editor-web/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run SwiftLint
        run: mise run lint

  typecheck-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck

  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release
