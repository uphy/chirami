name: CI

# No `paths` / `paths-ignore` filter on purpose:
#   1. A path-filtered workflow never reports a conclusion when it is skipped,
#      so any PR touching only excluded paths would sit forever on
#      "Expected - Waiting for status to be reported" once these jobs are
#      configured as required status checks.
#   2. The previous allowlist was already stale - project.yml, cmd/**,
#      mise.toml, Chirami/Resources/** and .github/workflows/** were all
#      uncovered, so changes there shipped without any CI at all.
# `concurrency` below plus the dependency caches keep the wasted minutes low.
on:
  pull_request:
  # Two independently green PRs can still break main once merged, so validate
  # the merge result as well.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; main builds always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: swiftlint
      - name: Run SwiftLint
        run: mise run lint

  typecheck-editor:
    name: Editor (lint / typecheck / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node comes from mise.toml so the local and CI toolchains cannot drift.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('editor-web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build-cli:
    name: Go CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/chirami
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: go

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('cmd/chirami/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Verify go.mod / go.sum are tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  test-and-build:
    name: Swift test / release build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('editor-web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Chirami/Resources/editor is a declared `.copy()` resource in
      # Package.swift but its contents are generated and gitignored. Without
      # this step swift build only emits an "Invalid Resource" warning and
      # happily produces a binary with no editor at all.
      - name: Build editor bundle
        working-directory: editor-web
        run: |
          npm ci
          npm run build

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # Package.resolved is committed, so this key actually varies. Package.swift
          # is included as a fallback so the key never collapses to a bare prefix if
          # the resolved file is ever missing.
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Verify Package.resolved is up to date
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Run tests
        run: swift test

      - name: Build release
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'Invalid Resource' "$RUNNER_TEMP/build.log"; then
            echo "::error::swift build reported an Invalid Resource warning - a declared resource is missing from the bundle"
            exit 1
          fi
