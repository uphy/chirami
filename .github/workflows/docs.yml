name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # Changes to this workflow itself must be able to trigger a deploy,
      # otherwise a fix here would sit unverified until the next docs edit.
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Scoped per the GitHub Pages starter workflow: `pages: write` and
# `id-token: write` are what actions/configure-pages and actions/deploy-pages
# need to mint the OIDC-backed deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts one deployment at a time; never cancel one mid-flight or the
# published site can be left on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout is enough: .vitepress/config.ts does not enable
      # `lastUpdated`, so no git history is read at build time. Re-add
      # `fetch-depth: 0` if that option is ever turned on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node comes from mise.toml (24.x) so docs, editor-web and local dev
      # cannot drift apart on the toolchain version.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: node

      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-docs-${{ runner.os }}-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: npm-docs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run docs:build
        working-directory: docs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
