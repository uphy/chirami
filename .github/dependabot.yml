# Dependabot configuration.
#
# This is a solo-maintained repository, so the goal is "a small, predictable
# batch of PRs once a month" rather than "the newest possible dependency at
# all times":
#
#   - interval: monthly for every ecosystem. Weekly would produce more PRs
#     than a single maintainer can review; security advisories are delivered
#     by Dependabot security updates regardless of this schedule.
#   - Aggressive grouping. Minor/patch bumps are collapsed into one PR per
#     ecosystem. Tightly coupled package families (@codemirror/*, react*) are
#     grouped across *all* update types because they must be upgraded
#     together or the build breaks.
#   - Standalone majors. A major bump outside those families gets its own PR
#     so the breaking change can be reviewed on its own.
#   - Low open-pull-requests-limit so stalled PRs cannot snowball.
version: 2

updates:
  # ---------------------------------------------------------------- Actions
  # Workflows pin actions to commit SHAs (with a `# vX.Y.Z` comment).
  # Dependabot understands that convention: it bumps the SHA and rewrites the
  # version comment, so pinning does not freeze us on an old release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'

  # ------------------------------------------------------------- editor-web
  - package-ecosystem: npm
    directory: /editor-web
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
    # Groups are matched top-down: the first matching group wins, so the
    # coupled families must be declared before the catch-all.
    groups:
      # @codemirror/* and @lezer/* share internal APIs; bumping one without
      # the others yields duplicate-package runtime errors.
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      # react and react-dom must always match, and the @types follow them.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # @eslint/js is released in lockstep with eslint and peer-requires the
      # matching major, so a standalone @eslint/js bump leaves the pair
      # mismatched. The plugins ride along because their peer ranges are what
      # gate an eslint major.
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
      # typescript-eslint declares a peer range that pins the TypeScript major
      # (e.g. `>=4.8.4 <6.1.0`), so a standalone TypeScript major PR cannot even
      # get through `npm ci`. Move the compiler and its ESLint integration
      # together.
      typescript:
        patterns:
          - typescript
          - typescript-eslint
          - '@typescript-eslint/*'
      # Everything else: one PR for all non-breaking bumps, individual PRs
      # for majors.
      editor-web-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ------------------------------------------------------------------- docs
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      docs-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # --------------------------------------------------------------- Go (CLI)
  - package-ecosystem: gomod
    directory: /cmd/chirami
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # -------------------------------------------------------- Swift (SwiftPM)
  # Requires Package.resolved to be committed at the repository root.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    ignore:
      # swift-testing switched from a 0.x line to tags that track the Swift
      # release train (6.x). Dependabot reads that as a major bump, but the 6.x
      # manifests require a newer tools version than this package declares, so
      # the resulting PR cannot resolve at all. Stay on the 0.x line; the
      # dependency goes away entirely once the test target can use the copy of
      # Swift Testing bundled with the toolchain.
      - dependency-name: github.com/swiftlang/swift-testing
        update-types:
          - version-update:semver-major
    groups:
      swift-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
